name: hansard-annotator-dev

services:
  postgres:
    image: postgres:16.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hansard-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    profiles: ["web"]
    restart: unless-stopped
    environment:
      HANSARD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      HANSARD_PROCESSED_DATA_ROOT: /app/data/processed
      HANSARD_APP_ENV: development
      HANSARD_SESSION_SECRET: ${HANSARD_SESSION_SECRET:-}
      HANSARD_COOKIE_SECURE: "false"
      HANSARD_ALLOWED_HOSTS: 127.0.0.1,localhost
      HANSARD_BASE_URL: http://127.0.0.1:8000
    command:
      - python
      - -m
      - uvicorn
      - hansard_annotator.web.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro

volumes:
  hansard-postgres-data:
